<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — AURA Haute Parfumerie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #121215;
            --accent-gold: #d4af37;
            --text-main: #f0f0f2;
            --text-muted: #8e8e93;
            --border-color: #222228;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background: var(--bg-dark); color: var(--text-main); padding: 40px 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .profile-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; font-size: 13px; margin-bottom: 25px; transition: color 0.2s; }
        .btn-back:hover { color: var(--accent-gold); }

        .avatar-wrap { width: 120px; height: 120px; margin: 0 auto 20px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent-gold); position: relative; background: #1c1c24; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--text-muted); }

        .username { font-size: 24px; font-weight: 400; letter-spacing: 1px; color: #fff; margin-bottom: 5px; }
        .user-email { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; }

        .upload-label { display: inline-flex; align-items: center; gap: 10px; background: #1a1a20; border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 13px; color: var(--accent-gold); transition: all 0.3s; }
        .upload-label:hover { border-color: var(--accent-gold); background: #22222a; }
        .file-input { display: none; }
    </style>
</head>
<body>

    <div class="profile-card">
        <a href="/" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Вернуться в каталог</a>

        <div class="avatar-wrap">
            {% if profile and profile.avatar %}
                <img src="{{ profile.avatar.url }}" class="avatar-img" alt="Avatar">
            {% else %}
                <div class="avatar-placeholder">
                    <i class="fa-regular fa-user"></i>
                </div>
            {% endif %}
        </div>

        <h1 class="username">{{ user.username }}</h1>
        <p class="user-email">{{ user.email|default:"Клиент AURA Haute Parfumerie" }}</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label class="upload-label">
                <i class="fa-solid fa-camera"></i> Изменить аватарку
                <input type="file" name="avatar" class="file-input" accept="image/*" onchange="this.form.submit()">
            </label>
        </form>
    </div>

</body>
</html>
